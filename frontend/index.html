<!doctype html>
<html lang="en" data-theme="dark" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>SentinelAI console</title>
    <script>
      // Apply the stored theme and density before first paint (no flash). Both are per-user conveniences.
      try {
        var t = localStorage.getItem('sentinel.theme');
        var d = localStorage.getItem('sentinel.density');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (d === 'compact' || d === 'comfortable') document.documentElement.dataset.density = d;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
