# SentinelAI infrastructure. Everything also runs without Docker (in-process
# fallbacks: SQLite, SQLite FTS5, local folder, in-memory stream).
#   docker compose --profile lite up -d     # PostgreSQL + pgvector only
#   docker compose --profile full up -d     # + Kafka, OpenSearch, MinIO, Prometheus, Grafana
# Secrets come from the environment / a git-ignored .env (see .env.example).
name: sentinelai

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["lite", "full"]
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SENTINEL_AGENT_PASSWORD: ${SENTINEL_AGENT_PASSWORD:?set SENTINEL_AGENT_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    profiles: ["full"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports: ["127.0.0.1:9092:9092"]
    mem_limit: 768m

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles: ["full"]
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"   # local dev only: bound to 127.0.0.1 (see docs/security-notes.md)
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports: ["127.0.0.1:9200:9200"]
    mem_limit: 1g
    volumes: [osdata:/usr/share/opensearch/data]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["full"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SENTINEL_MINIO_ACCESS_KEY:?set SENTINEL_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${SENTINEL_MINIO_SECRET_KEY:?set SENTINEL_MINIO_SECRET_KEY in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    mem_limit: 256m
    volumes: [miniodata:/data]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["full"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 256m

  grafana:
    image: grafana/grafana-oss:11.3.1
    profiles: ["full"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    mem_limit: 256m

volumes:
  pgdata:
  osdata:
  miniodata:
