# Tool configuration only; the backend is run from this directory, not installed.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["infra: needs the docker-compose services (skips cleanly when they are not reachable)"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
